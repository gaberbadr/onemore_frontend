<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>One More</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <style>
      .app-loader {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        height: 100dvh;
        background-color: #fafafa;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .app-loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 106, 0, 0.2);
        border-top-color: #ff6a00;
        border-radius: 50%;
        animation: app-loader-spin 1s linear infinite;
        margin-bottom: 24px;
      }
      @keyframes app-loader-spin {
        to { transform: rotate(360deg); }
      }
      .app-loader-text {
        font-size: 28px;
        font-weight: 900;
        color: #0a0a0a;
        letter-spacing: -1px;
      }
      .app-loader-text span {
        color: #ff6a00;
      }
    </style>
    <div id="root">
      <div class="app-loader">
        <div class="app-loader-spinner"></div>
        <div class="app-loader-text">ONE<span>MORE</span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
